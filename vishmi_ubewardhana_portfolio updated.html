<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:#040b18;color:#f0f6ff;font-family:'Outfit',sans-serif}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:#040b18}
::-webkit-scrollbar-thumb{background:#4da3ff;border-radius:2px}
.fd{font-family:'Cormorant Garamond',serif}
.fm{font-family:'JetBrains Mono',monospace}
.fb{font-family:'Outfit',sans-serif}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}
@keyframes scanline{0%{top:-10%}100%{top:110%}}
@keyframes ringPulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.5);opacity:0}}
.af{animation:float 6s ease-in-out infinite}
.as{background:linear-gradient(90deg,#4da3ff 0%,#bfe0ff 40%,#4da3ff 80%);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 3s linear infinite}
.ab{animation:blink 1.1s step-end infinite}
.au{animation:fadeUp .65s ease forwards;opacity:0}
.grid-bg{background-image:linear-gradient(rgba(77,163,255,.04)1px,transparent 1px),linear-gradient(90deg,rgba(77,163,255,.04)1px,transparent 1px);background-size:40px 40px}
.card{transition:all .32s cubic-bezier(.4,0,.2,1);border:1px solid rgba(77,163,255,.08)}
.card:hover{border-color:rgba(77,163,255,.35);transform:translateY(-4px);box-shadow:0 18px 36px rgba(77,163,255,.08)}
.nl{position:relative;transition:color .2s;text-decoration:none}
.nl::after{content:'';position:absolute;bottom:-2px;left:0;width:0;height:1px;background:#4da3ff;transition:width .3s}
.nl:hover::after{width:100%}
.tag{font-family:'JetBrains Mono',monospace;font-size:.65rem;padding:3px 9px;border-radius:99px;background:rgba(77,163,255,.07);color:#4da3ff;border:1px solid rgba(77,163,255,.18);letter-spacing:.04em;transition:all .2s;white-space:nowrap;display:inline-block}
.tag:hover{background:rgba(77,163,255,.15)}
.glow{text-shadow:0 0 28px rgba(77,163,255,.4)}
.sl{position:absolute;left:0;right:0;height:2px;background:linear-gradient(transparent,rgba(77,163,255,.07),transparent);animation:scanline 5s linear infinite;pointer-events:none}
.pnum{font-family:'Cormorant Garamond',serif;font-size:4.5rem;font-weight:300;color:rgba(77,163,255,.07);position:absolute;top:10px;right:16px;pointer-events:none;transition:color .3s;line-height:1}
.card:hover .pnum{color:rgba(77,163,255,.14)}
.gh-btn{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:7px;background:rgba(77,163,255,.06);border:1px solid rgba(77,163,255,.15);color:rgba(255,255,255,.6);font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:.05em;text-decoration:none;transition:all .22s;cursor:pointer}
.gh-btn:hover{background:rgba(77,163,255,.12);border-color:rgba(77,163,255,.4);color:#f0f6ff}
.pbar{height:2px;background:rgba(77,163,255,.12);border-radius:1px;overflow:hidden}
.pfill{height:100%;background:linear-gradient(90deg,#4da3ff,#9fd0ff);border-radius:1px;transition:width 1.2s cubic-bezier(.4,0,.2,1)}
.skcard{padding:18px 20px;border-radius:12px;background:rgba(8,20,42,.7);border:1px solid rgba(77,163,255,.08);transition:border-color .25s}
.skcard:hover{border-color:rgba(77,163,255,.22)}
.dot{width:5px;height:5px;border-radius:50%;background:#4da3ff;flex-shrink:0;margin-top:7px}
</style>

function useInView(ref){
  const[v,setV]=useState(false);
  useEffect(()=>{
    const o=new IntersectionObserver(([e])=>{if(e.isIntersecting)setV(true)},{threshold:0.08});
    if(ref.current)o.observe(ref.current);
    return()=>o.disconnect();
  },[]);
  return v;
}

              <div className="fm" style={{color:'rgba(77,163,255,.36)',fontSize:'.64rem',letterSpacing:'.08em',textAlign:'right'}}>{exp===i?'▲ collapse':'▼ details'}</div>
